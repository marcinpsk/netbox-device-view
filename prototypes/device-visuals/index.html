<style>
:root{color-scheme:light;--bg:#f3f5f7;--ink:#263442;--muted:#687786;--line:#d9e0e6;--green:#16836d;--soft:#eaf5f1;--blue:#236a9d;--amber:#946500}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit}button,a,select,input{touch-action:manipulation}button,select{min-height:36px;border:1px solid #cbd5de;border-radius:5px;background:#fff;color:var(--ink);padding:6px 11px}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--green);background:#f0f8f5}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #54a9d3;outline-offset:3px}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover:not(:disabled){background:#116e5c}button.link{border:0;background:transparent;color:var(--blue);padding:4px 0}a{color:var(--blue)}h1,h2,h3,p{margin:0}h1{font-size:27px;letter-spacing:-.6px;font-weight:650}h2{font-size:17px}h3{font-size:14px}small,.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.top{height:55px;background:#202c38;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-top:3px solid #6fb346}.brand{font-size:23px;font-weight:750;letter-spacing:-1px}.brand span{color:#87ca5b}.top small{color:#cad5de}.app{display:grid;grid-template-columns:178px minmax(0,1fr);min-height:calc(100vh - 55px)}.sidebar{background:#283744;color:#b9c6d0;padding:22px 12px}.sidebar .nav{padding:10px 12px;border-radius:4px;margin-bottom:4px}.sidebar .active{background:#3b4d5b;color:#fff;border-left:3px solid #8cc66b}.sidebar .cap{font-size:10px;letter-spacing:1.5px;margin:27px 12px 9px;color:#9bacba}.main{min-width:0;padding:22px 30px 110px;max-width:1600px;width:100%;margin:auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:13px}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.heading .sub{margin-top:5px;color:var(--muted)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#e4eaf0;color:#4b5d6c}.badge.green{background:#dff1e7;color:#146647}.badge.amber{background:#fff0ca;color:#805a08}.badge.blue{background:#e5f0fb;color:#23618e}.banner{border-left:3px solid #86a7be;background:#eaf0f5;padding:10px 13px;margin-bottom:17px;font-size:12px;color:#496173}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:19px;overflow:auto;white-space:nowrap}.tabs span{padding:8px 1px 10px;color:var(--muted)}.tabs .selected{color:var(--green);border-bottom:3px solid var(--green);font-weight:650}.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:16px;overflow:hidden}.panel-head{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.panel-body{padding:17px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar label{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.segments{display:flex}.segments button{border-radius:0}.segments button:first-child{border-radius:5px 0 0 5px}.segments button:last-child{border-radius:0 5px 5px 0}.segments button.on{background:var(--soft);border-color:#7fae9e;color:#11634e}.drawing{background:#edf1f4;border-top:1px solid #edf0f2;border-bottom:1px solid #edf0f2;padding:30px 22px;overflow:auto}.drawing svg{display:block;min-width:660px;margin:0 auto;height:auto}.panel-note{padding:10px 17px;color:var(--muted);font-size:12px}.legend{display:flex;flex-wrap:wrap;gap:17px;font-size:12px;padding:12px 17px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#26896a}.dot.grey{background:#8999a6}.dot.amber{background:#d39b2e}.dot.red{background:#bf5961}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:5px;padding:12px 15px}.stat strong{display:block;font-size:20px;font-weight:600}.stat small{font-size:11px}.study{padding:13px 17px;background:#f8fafb;border-bottom:1px solid var(--line)}.study label{font-size:12px;font-weight:600;margin-right:8px}.study select{max-width:100%}.study p{margin-top:7px;font-size:12px;color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:16px}.split>.panel{min-width:0}.component-list{max-height:460px;overflow:auto}.component-row{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0f2;gap:5px;font-size:12px}.component-row>span{min-width:0;overflow-wrap:anywhere}.component-row button{font-size:12px;min-height:32px;padding:2px 8px}.component-row.selected{background:#edf7f3}.workbench>div,.split>div{min-width:0}.workbench{display:grid;grid-template-columns:205px minmax(0,1fr);gap:16px}.tree{padding:15px;background:#fff;border:1px solid var(--line);border-radius:6px;align-self:start}.tree button{display:block;margin-top:8px;text-align:left;width:100%;font-size:12px}.tree .indent{padding-left:16px}.tree .on{background:var(--soft);border-color:#80aa98}.focus-label{padding:9px 17px;font-size:12px;background:#eaf5f0;color:#246550}.statebox{padding:12px 17px;font-size:12px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}.statebox b{font-weight:600}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#203443;color:white;padding:8px 10px;border-radius:9px;box-shadow:0 5px 25px #14233440;z-index:40;max-width:calc(100vw - 24px)}.switcher button{background:#334a5b;color:white;border-color:#4b6273;min-width:36px}.switcher strong{font-size:12px;white-space:nowrap}.switcher small{display:block;color:#b9c9d4;font-size:10px}.overlay{position:fixed;inset:0;background:#14273745;z-index:50;display:flex;justify-content:flex-end}.drawer{background:white;width:min(440px,100vw);height:100%;overflow:auto;box-shadow:-8px 0 40px #152b3a22}.drawer header{position:sticky;top:0;background:white;display:flex;justify-content:space-between;padding:20px;border-bottom:1px solid var(--line);z-index:1}.drawer .body{padding:20px}.drawer h2{overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:140px 1fr;gap:10px;font-size:13px;margin:18px 0}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.drawer select{width:100%;margin-bottom:14px}.callout{padding:12px;border:1px solid #e8d7a7;border-radius:5px;background:#fff8e6;color:#7b611e;font-size:12px;margin:12px 0}.good{background:#ecf8f0;border-color:#b9dcc5;color:#256c40}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.links button{color:var(--blue)}.hovercard{position:fixed;background:#fff;border:1px solid #bccbd7;box-shadow:0 7px 24px #233a4930;border-radius:6px;padding:13px;z-index:45;width:270px;font-size:12px}.hovercard strong{display:block;overflow-wrap:anywhere}.hovercard p{margin:6px 0}.hovercard button{font-size:12px}.notice{padding:12px 16px;background:#e8f4ed;border-left:3px solid var(--green);margin-bottom:16px;font-size:13px}.warning{background:#fff4dd;border-left-color:#b97f12}.stepper{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.step{flex:1;min-width:130px;padding:12px;border-bottom:3px solid #d8e1e8;color:var(--muted);background:white}.step.done{border-color:var(--green);color:#246750}.step strong{display:block;font-size:13px}.updategrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#f8fafb}td,th{padding:11px 16px;border-bottom:1px solid #e6ebef}.checks label{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:12px}.checks input{width:16px;height:16px}.empty{padding:25px;text-align:center;color:var(--muted)}.safety{font-size:12px;color:var(--muted);margin-top:12px}.update-art{display:grid;grid-template-columns:1fr 1fr;gap:12px}.update-art>div{padding:14px;background:#f4f6f8;border:1px solid var(--line);border-radius:5px}.update-art svg{width:100%;height:65px}.timeline{padding-left:18px;font-size:12px;color:var(--muted)}details.sources{font-size:12px;color:var(--muted);margin-top:15px}details.sources p{margin-top:8px}.hot{cursor:pointer}.hot:focus{outline:none}.hot:focus>.focus-ring{stroke:#36a7f0;stroke-width:3}.hot:hover>.focus-ring{stroke:#8ce2ff;stroke-width:2.5}.hot .focus-ring{pointer-events:none}.svgtext{font-family:system-ui,sans-serif}.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);padding:11px 20px;background:#213b49;color:white;border-radius:6px;z-index:60;max-width:90vw;font-size:13px}.mini-state{font-size:12px;margin-top:7px;color:var(--muted)}.vc-label{padding:10px 17px;font-size:12px;border-bottom:1px solid var(--line);background:#f7fafb}.vc-label.active{border-left:3px solid var(--green)}.help{font-size:12px;color:var(--muted);margin-top:12px}.back{margin-bottom:15px}.objectpage{max-width:750px}.objectpage .facts{grid-template-columns:180px 1fr}.revision-pill{font-size:11px;padding:2px 6px;background:#edf1f4;border-radius:4px}.hidden{display:none!important}@media(max-width:1000px){.app{grid-template-columns:135px minmax(0,1fr)}.main{min-width:0;padding:18px 18px 110px}.split{grid-template-columns:1fr}.component-list{max-height:230px}.updategrid{grid-template-columns:1fr}.workbench{grid-template-columns:160px minmax(0,1fr)}}@media(max-width:650px){.sidebar{display:none}.app{grid-template-columns:minmax(0,1fr)}.top{padding:0 15px}.top small{font-size:10px}.main{min-width:0;padding:16px 12px 110px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:24px}.heading .row{width:100%}.summary{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:9px 12px}.workbench{grid-template-columns:1fr}.tree .indent{padding-left:0}.tree button{display:inline-block;width:auto;margin-right:5px}.drawing{padding:24px 12px}.panel-head{padding:12px}.tabs{gap:17px;font-size:12px}.switcher{gap:10px;bottom:12px}.update-art{grid-template-columns:1fr}.facts{grid-template-columns:115px 1fr}.banner{font-size:11px}.toolbar{gap:8px}.toolbar input[type=range]{width:100px}}

<body>
<div class="top"><div class="brand">net<span>box</span></div><small>DEVICE ARTWORK STUDY · LOCAL SAMPLE DATA</small></div>
<div class="app"><aside class="sidebar"><div class="nav">⌂ &nbsp; Organization</div><div class="nav active">▣ &nbsp; Devices</div><div class="nav">▤ &nbsp; Racks</div><div class="nav">◇ &nbsp; IPAM</div><div class="cap">PLUGINS</div><div class="nav">Device Views</div><div class="nav"><button class="link" data-action="review" style="color:#c5d8e6">Artwork Library</button></div><div class="cap">PROTOTYPE</div><small>All changes stay in memory.<br>Reload to reset.</small></aside><main class="main" id="app"></main></div>
<div class="switcher"><button id="prevVariant" aria-label="Previous design">←</button><div><small>COMPARE VIEWS · ← / →</small><strong id="variantLabel"></strong></div><button id="nextVariant" aria-label="Next design">→</button></div>
<div id="overlay"></div><div id="hover" class="hovercard hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const variants={A:'Device view',B:'Inventory inspection',C:'Module workbench'};
const scenarios={normal:'Recorded connectivity',disabled:'Cabled + administratively disabled',fallback:'Installed part without artwork',missing:'No transceiver recorded',unresolved:'Missing / ambiguous binding',repeat:'Repeated artwork, independent devices',vc:'Virtual chassis, mixed artwork'};
const initial=()=>({device:'acs',face:'rear',scenario:'normal',page:'device',selected:null,focus:'chassis',zoom:100,revision:{acs:1,cisco:1},previous:{acs:null,cisco:null},update:{checked:false,imported:false,origin:null,source:'Community device visuals',broken:false,restricted:false,rejected:false},history:[],notice:''});
let state=initial(),variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';
let components={},hideTimer,toastTimer;
// Small in-memory update model. Import, validation and activation stay separate.
function transition(s,a){const n=structuredClone(s);n.notice='';if(a.type==='check'){n.update.checked=true;n.notice='Candidate revision 2 is available. Active artwork is unchanged.'}
if(a.type==='fetch'||a.type==='offline'){n.update.checked=true;n.update.imported=true;n.update.origin=a.type==='offline'?'Offline bundle':n.update.source;n.update.rejected=false;n.notice='Revision 2 imported for review. Active artwork is unchanged.';n.history.push('Imported revision 2 from '+n.update.origin.toLowerCase())}
if(a.type==='unsafe'){n.update.rejected=true;n.notice='Sample unsafe bundle rejected. No definition or active association changed.';n.history.push('Rejected sample unsafe bundle')}
if(a.type==='activate'){if(!n.update.imported||n.update.broken||n.update.restricted){n.notice='Activation blocked. Complete the review and resolve new binding failures.';return n}if(n.revision[n.device]===2)return n;n.previous[n.device]=n.revision[n.device];n.revision[n.device]=2;n.notice='Type association now uses revision 2. Instance selections remain pinned.';n.history.push('Activated revision 2 for the selected type')}
if(a.type==='rollback'){if(n.previous[n.device]!==null){n.revision[n.device]=n.previous[n.device];n.previous[n.device]=null;n.notice='Previous revision restored. Local naming overrides are unchanged.';n.history.push('Restored previous revision')}}return n}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=()=>state.device==='acs'?'Avocent ACS6048DAC-G2':'Cisco C9300-24T';
const sample=()=>state.device==='acs'?'console-demo-01':'switch-demo-01';
function register(key,data){if(data.device?.endsWith('-b'))data={...data,pk:data.pk+10000};components[key]={key,cabled:false,enabled:null,marked:false,planned:false,path:'Not applicable',binding:'Resolved',kind:'interface',art:'Detailed',...data};return components[key]}
function altered(c){if(c.kind==='interface'&&c.primary&&state.scenario==='disabled'){c.cabled=true;c.enabled=false;c.path='Complete'}if(c.primary&&state.scenario==='unresolved'){c.binding='Missing';c.cabled=null;c.path='Unknown'}if(c.second&&state.scenario==='unresolved'){c.binding='Ambiguous';c.cabled=null;c.path='Unknown'}return c}
function stateColor(c){return c.binding!=='Resolved'?'#e4b048':c.cabled?'#39ae8a':'#89959e'}
function hot(c,x,y,w,h,art){return `<g class="hot" tabindex="0" role="link" aria-label="${esc(c.name)}: ${esc(c.binding==='Resolved'?(c.cabled?'cabled':'no cable recorded'):c.binding+' binding')}" data-key="${esc(c.key)}"><title>${esc(c.name)}</title>${art}<rect class="focus-ring" x="${x-2}" y="${y-2}" width="${w+4}" height="${h+4}" fill="none" stroke="${stateColor(c)}" stroke-width="1.3" rx="2" ${c.binding!=='Resolved'?'stroke-dasharray="3 2"':''}/>${c.cabled?`<path d="M${x+w-8} ${y-4}l3 3 5-6" fill="none" stroke="#8ae8c5" stroke-width="2"/>`:''}${c.enabled===false?`<text x="${x+w-1}" y="${y+h+13}" fill="#a83b46" font-size="11" font-weight="bold">×</text>`:''}${c.binding!=='Resolved'?`<text x="${x+w-4}" y="${y-4}" fill="#b47500" font-size="11" font-weight="bold">?</text>`:''}</g>`}
function rj(c,x,y,w=24,h=21){let pins='';for(let i=0;i<8;i++)pins+=`<path d="M${x+4+i*(w-8)/8} ${y+4}v4" stroke="#cbb66d" stroke-width=".8"/>`;return hot(c,x,y,w,h,`<rect x="${x-1}" y="${y-1}" width="${w+2}" height="${h+2}" rx="1" fill="#bcc3c4" stroke="#5d676b"/><path d="M${x+2} ${y+2}h${w-4}v${h-7}h-5v4h-${w-14}v-4h-5z" fill="#182126"/>${pins}`)}
function power(c,x,y){return hot(c,x,y,34,38,`<rect x="${x}" y="${y}" width="34" height="38" rx="3" fill="#171e21" stroke="#7e8b91"/><path d="M${x+7} ${y+8}h20v23H${x+7}z" fill="#30393d"/><path d="M${x+16} ${y+12}v7m-7 4v7m14-7v7" stroke="#d4dadd" stroke-width="3"/>`)}
function svgStart(id,vb='0 0 1100 150'){return `<svg class="svgtext" xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" aria-label="${esc(title())} hardware illustration" style="width:${state.zoom}%"><defs><linearGradient id="${id}-metal" x2="0" y2="1"><stop stop-color="#d9dddf"/><stop offset=".4" stop-color="#aeb7bd"/><stop offset="1" stop-color="#c9cfd2"/></linearGradient><linearGradient id="${id}-dark" x2="0" y2="1"><stop stop-color="#4b5255"/><stop offset="1" stop-color="#282e31"/></linearGradient></defs>`}
function frame(id,dark=false){return `<rect x="10" y="26" width="1080" height="100" rx="4" fill="${dark?'#454d50':'#a8b2b7'}" stroke="#64727a"/><rect x="35" y="26" width="1030" height="100" fill="url(#${id}-${dark?'dark':'metal'})" stroke="#67737a"/>${[20,1080].map(x=>[43,106].map(y=>`<rect x="${x-4}" y="${y}" width="8" height="13" rx="4" fill="#36424a"/>`).join('')).join('')}`}
function acs(face,id='acs-a',schematic=false){let o=svgStart(id+'-'+face)+frame(id+'-'+face,face==='front');if(face==='front'){o+=`<text x="65" y="62" fill="#f3f5f6" font-size="18" font-weight="600">AVOCENT</text><text x="873" y="62" fill="#f2f4f5" font-size="13">ACS 6048</text><rect x="37" y="118" width="1026" height="3" fill="#e99436"/><rect x="205" y="81" width="28" height="12" fill="#101c22" stroke="#c3c8c9"/><text x="204" y="108" fill="#b1bdc4" font-size="7">USB</text>`;for(let i=0;i<4;i++)o+=`<circle cx="${270+i*19}" cy="89" r="3" fill="#65726a"/>`;for(let i=0;i<48;i++){let x=375+Math.floor(i/2)*16,y=80+(i%2)*17;o+=`<circle cx="${x}" cy="${y}" r="2.5" fill="#68786c"/><text x="${x}" y="${i%2?111:70}" text-anchor="middle" font-size="5" fill="#b8c1c5">${i+1}</text>`}o+=`<text x="270" y="111" fill="#a9b7bf" font-size="6">PWR / CPU · ETH · AUX</text>`}else{for(let i=0;i<2;i++){let c=register(id+'-ps'+i,{name:'ps'+(i+1),kind:'powerport',device:id,cabled:true,target:'power-ports',pk:600+i});o+=power(c,52+i*43,65)}for(let i=0;i<48;i++){let x=165+Math.floor(i/2)*31+Math.floor(i/16)*9,y=i%2?91:51;let c=altered(register(id+'-p'+(i+1),{name:'ttyS'+(i+1),kind:'consoleserverport',device:id,cabled:i%4===0||i===1,path:i%4===0?'Complete':'No cable recorded',target:'console-server-ports',pk:100+i,primary:i===0&&id==='acs-a',second:i===1&&id==='acs-a',marked:i===5,planned:i===8,peer:'console-peer-'+String(i+1).padStart(2,'0')}));o+=rj(c,x,y,24,20)+`<text x="${x+12}" y="${i%2?123:45}" text-anchor="middle" font-size="6" fill="#34434c">${i+1}</text>`}let labels=['eth1','aux','eth0','console'];labels.forEach((n,i)=>{let c=register(id+'-'+n,{name:n,kind:n.startsWith('eth')?'interface':'consoleport',enabled:n.startsWith('eth')?true:null,device:id,cabled:n==='eth0',target:n.startsWith('eth')?'interfaces':'console-ports',pk:300+i,primary:n==='eth0'&&id==='acs-a',path:n==='eth0'?'Complete':'No cable recorded'});altered(c);let x=961+(i%2)*43,y=i<2?51:91;o+=rj(c,x,y,27,20)+`<text x="${x+13}" y="${i<2?45:123}" text-anchor="middle" fill="#34434c" font-size="6">${n.toUpperCase()}</text>`});o+=`<text x="52" y="48" font-size="7" fill="#34434c">AC 1 &nbsp; AC 2</text>`}return o+'</svg>'}

function draw(face,id,schematic=false,focus=false){return state.device==='acs'?acs(face,id,schematic):cisco(face,id,schematic,focus)}
function legend(){return `<div class="legend"><span><i class="dot"></i>✓ Cable recorded</span><span><i class="dot grey"></i>No cable recorded</span><span><i class="dot red"></i>× Admin disabled</span><span><i class="dot amber"></i>? Unresolved inventory</span></div>`}
function hardwarePanel(face,id,schematic=false,focus=false){return `<section class="panel"><div class="panel-head"><h2>${focus?'Network module':face==='front'?'Front panel':'Rear panel'}</h2><span class="revision-pill">${schematic?'Schematic fallback':'Artwork r'+state.revision[state.device]}</span></div><div class="drawing">${draw(face,id,schematic,focus)}</div>${legend()}<div class="panel-note">${state.device==='acs'&&face==='front'?'USB and decorative LEDs. No live LED state is inferred from NetBox.':'Click a connector to open its record. Hover or focus for details. Scroll within the drawing when zoomed.'}</div></section>`}

function summary(){let cs=Object.values(components).filter(c=>c.kind!=='module'&&c.kind!=='modulebay');return `<div class="summary"><div class="stat"><strong>${cs.length}</strong><small>Visible component bindings</small></div><div class="stat"><strong>${cs.filter(c=>c.cabled).length}</strong><small>Cables recorded</small></div><div class="stat"><strong>${cs.filter(c=>c.enabled===false).length}</strong><small>Administratively disabled</small></div><div class="stat"><strong>${Object.values(components).filter(c=>c.binding!=='Resolved').length}</strong><small>Unresolved records / bindings</small></div></div>`}

function scenarioHelp(){return ({normal:'Cable attachment, administrative state and binding resolution are independent facts.',disabled:'A disabled Ethernet interface still has its cable. Inspect eth0 on the ACS rear or port 1 on the Cisco front.',fallback:'The Cisco network module and its installed optics use schematic rendering; the surrounding chassis stays detailed.',missing:'The Cisco first optic is no longer recorded. The bay remains visible without inventing an installed transceiver.',unresolved:'The first two connector bindings are missing and ambiguous. Neither is represented as a known uncabled connector.',repeat:'Two copies have separate component identities. Open a connector on either copy and compare the device and record.',vc:'Two Cisco members retain rack ordering and member labels. The second member uses schematic fallback.'})[state.scenario]}

function renderDevice(){components={};let id=state.device==='acs'?'acs-a':'cisco-a',multiple=['repeat','vc'].includes(state.scenario),body='';if(variant==='A'){body=hardwarePanel(state.face,id);if(multiple)body=`<div class="vc-label active">Member 1 · ${sample()} · U20 · selected device</div>`+body+`<div class="vc-label">Member 2 · ${state.device==='acs'?'console':'switch'}-demo-02 · U19</div>`+hardwarePanel(state.face,state.device==='acs'?'acs-b':'cisco-b',state.scenario==='vc')}

return navHeading()+`<div class="banner"><strong>Throwaway visual prototype.</strong> Can detailed artwork, nested parts and partial schematic fallback remain understandable? Drawings are simplified studies, not approved reusable assets. All records, imports and navigation are simulated.</div>`+controls()+summary()+body+`<details class="sources"><summary>Drawing references and prototype limits</summary><p>ACS placement follows <a href="https://www.vertiv.com/4af99d/globalassets/products/monitoring-control-and-management/serial-consoles-and-gateways/avocent-acs-6000-advanced-console-server-installeruser-guide.pdf" target="_blank" rel="noreferrer">Vertiv's ACS6000 guide, figure 2.2</a>. Cisco composition follows the <a href="https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig/Product-overview.html" target="_blank" rel="noreferrer">Catalyst 9300 hardware overview</a>. These original SVG studies simplify geometry and decoration. Exact asset fidelity and licensing need review before library publication.</p><p>The nested Cisco fixture explicitly records optic bays. This is not the unchanged community template. No real network, file import, NetBox permissions, sanitizer, or database is exercised here.</p></details>`}

function reviewPage(){let u=state.update,active=state.revision[state.device],blocked=!u.imported||u.broken||u.restricted;return `<button class="link back" data-action="back">← Back to ${sample()}</button><div class="crumb">Plugins / Artwork Library / Update review</div><div class="heading"><div><h1>Review artwork update</h1><p class="sub">${title()} and installed parts · opened from ${sample()}</p></div><span class="badge blue">Plugin page</span></div><div class="banner">Interaction prototype. Repository checks and bundle imports use built-in examples. No files are uploaded and no network requests are made.</div>${state.notice?`<div class="notice ${u.rejected||u.broken||u.restricted?'warning':''}" role="status">${esc(state.notice)}</div>`:''}<div class="stepper"><div class="step ${u.checked?'done':''}"><strong>1 · Discover</strong><small>Check a configured source</small></div><div class="step ${u.imported?'done':''}"><strong>2 · Import</strong><small>Store a candidate revision</small></div><div class="step ${u.imported&&!u.broken&&!u.restricted?'done':''}"><strong>3 · Review</strong><small>Preview bindings and impact</small></div><div class="step ${active===2?'done':''}"><strong>4 · Activate</strong><small>Explicitly update the association</small></div></div><div class="updategrid"><div><section class="panel"><div class="panel-head"><h2>Source and candidate</h2><span class="badge">${u.imported?'Imported, not automatically active':u.checked?'Update available':'Not checked'}</span></div><div class="panel-body"><label for="source">Configured artwork source</label><div class="row" style="margin:8px 0 15px"><select id="source">${['Community device visuals','Internal artwork library'].map(name=>`<option ${u.source===name?'selected':''}>${name}</option>`).join('')}</select><button data-action="check">Check repository</button><button data-action="fetch" ${!u.checked?'disabled':''}>Fetch candidate</button></div><div class="row"><button data-action="offline">Load offline bundle example</button><button data-action="unsafe">Try rejected bundle</button></div><p class="help">Offline UI and API imports use the same review path. All dependencies are included in the example bundle.</p><div class="update-art" style="margin-top:18px"><div><small>ACTIVE ASSOCIATION</small><h3>Revision ${active}</h3>${miniArt(active)}</div><div><small>${u.imported?'IMPORTED CANDIDATE':'AVAILABLE AFTER IMPORT'}</small><h3>Revision ${u.checked?'2':'?'}</h3>${u.checked?miniArt(2):'<div class="empty">Check a source or import a bundle</div>'}</div></div><p class="help">Candidate changes: clearer connector labels and refined module outlines. No inventory names are changed.</p></div></section><section class="panel"><div class="panel-head"><h2>Activation impact</h2><span class="badge">Type association</span></div>${u.restricted?'<div class="panel-body"><div class="callout">Your permissions do not allow a complete impact review. Activation is unavailable. Hidden device names and counts are not shown.</div></div>':`<div class="table-wrap"><table><thead><tr><th>Device</th><th>Selection</th><th>After activation</th></tr></thead><tbody><tr><td>${sample()}</td><td>Type default · r${active}</td><td>Revision 2</td></tr><tr><td>${state.device==='acs'?'console':'switch'}-demo-02</td><td>Type default · r${active}</td><td>Revision 2</td></tr><tr><td>${state.device==='acs'?'console':'switch'}-demo-03</td><td>Instance override · r1</td><td>Unchanged · revision 1</td></tr></tbody></table></div>`}<div class="panel-note">Local type and instance naming overrides are retained.</div></section><section class="panel"><div class="panel-head"><h2>Binding review</h2></div><div class="panel-body">${!u.imported?'<p class="muted">Import a candidate to compare bindings.</p>':u.broken?'<div class="callout"><strong>New binding failure</strong><br>A connector that resolved in the active revision has no target in revision 2. Correct the binding before activation.</div><button data-action="repair">Correct sample binding</button>':'<div class="callout good">Previously resolved bindings remain resolved.</div><p class="help">Two pre-existing missing inventory records remain unresolved. They are visible, but do not block this update.</p>'}<p class="help">The production design must recheck bindings and impact at activation time.</p></div></section></div><aside><section class="panel"><div class="panel-head"><h2>Review controls</h2></div><div class="panel-body checks"><label><input id="broken" type="checkbox" ${u.broken?'checked':''}> Candidate breaks a binding</label><label><input id="restricted" type="checkbox" ${u.restricted?'checked':''}> Reviewer has limited visibility</label><hr style="border:0;border-top:1px solid #e2e7eb;margin:18px 0"><button class="primary" id="activate" data-action="activate" ${blocked||active===2?'disabled':''}>${active===2?'Revision 2 active':'Activate for selected type'}</button><p class="help">${blocked?'Activation requires an imported candidate, intact existing bindings and complete impact visibility.':'Activation updates the two type-default devices. The instance override stays pinned.'}</p><button data-action="rollback" ${state.previous[state.device]===null?'disabled':''} style="margin-top:15px">Restore previous revision</button></div></section><section class="panel"><div class="panel-head"><h2>Current state</h2></div><div class="panel-body"><dl class="facts" style="grid-template-columns:100px 1fr"><dt>Active</dt><dd>Revision ${active}</dd><dt>Candidate</dt><dd>${u.imported?'Revision 2':'Not imported'}</dd><dt>Source</dt><dd>${u.origin||'Not fetched'}</dd><dt>Instance pin</dt><dd>Revision 1</dd></dl><h3>Session activity</h3><ol class="timeline">${state.history.map(h=>`<li>${esc(h)}</li>`).join('')||'<li>No changes</li>'}</ol></div></section></aside></div>`}
function render(){hideHover();document.getElementById('app').innerHTML=state.page==='review'?reviewPage():state.page==='object'?objectPage():renderDevice();document.getElementById('variantLabel').textContent=variant+' · '+variants[variant];bind();}
function hideHover(){clearTimeout(hideTimer);document.getElementById('hover').classList.add('hidden')}
function hover(key,el){clearTimeout(hideTimer);let c=components[key];if(!c)return;state.selected=key;let p=document.getElementById('hover');p.innerHTML=`<strong>${esc(c.name)}</strong><small>${esc(c.device)} · ${esc(c.kind)}</small><p>${esc(c.binding!=='Resolved'?c.binding:c.cabled?'✓ Cable recorded':'No cable recorded')}${c.enabled===false?' · Admin disabled':''}<br>${esc(c.art)} representation</p><button data-inspect="${esc(key)}">Component details</button>`;p.classList.remove('hidden');let r=el.getBoundingClientRect();p.style.left=Math.max(8,Math.min(innerWidth-278,r.left))+'px';p.style.top=Math.max(8,Math.min(innerHeight-p.offsetHeight-90,r.bottom+8))+'px';}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function bind(){document.getElementById('source')?.addEventListener('change',e=>{state.update.source=e.target.value;state.update.checked=false;state.update.imported=false;state.update.origin=null;render()});document.querySelectorAll('[data-key]').forEach(el=>{el.addEventListener('mouseenter',()=>hover(el.dataset.key,el));el.addEventListener('mouseleave',()=>{hideTimer=setTimeout(hideHover,400)});el.addEventListener('focus',()=>hover(el.dataset.key,el));el.addEventListener('click',()=>openRecord(el.dataset.key));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openRecord(el.dataset.key)}})});document.getElementById('deviceSelect')?.addEventListener('change',e=>{state.device=e.target.value;state.face=state.device==='acs'?'rear':'front';state.scenario='normal';state.selected=null;state.focus='chassis';state.update=initial().update;render()});document.getElementById('scenario')?.addEventListener('change',e=>{state.scenario=e.target.value;if(['fallback','missing','vc'].includes(state.scenario)){state.device='cisco';state.face='front'}if(state.scenario==='unresolved'||state.scenario==='disabled')state.face=state.device==='acs'?'rear':'front';render()});document.getElementById('zoom')?.addEventListener('input',e=>{state.zoom=Number(e.target.value);document.querySelectorAll('.drawing svg').forEach(s=>s.style.width=state.zoom+'%');e.target.nextElementSibling.textContent=state.zoom+'%'});document.getElementById('broken')?.addEventListener('change',e=>{state.update.broken=e.target.checked;render()});document.getElementById('restricted')?.addEventListener('change',e=>{state.update.restricted=e.target.checked;render()})}
function action(a){if(a==='review'){state.page='review';document.getElementById('overlay').innerHTML='';render();scrollTo(0,0);return}if(a==='back'){state.page='device';render();return}if(a==='details'){showDetails(state.selected);return}if(a==='close'){document.getElementById('overlay').innerHTML='';document.querySelector('[data-action="details"]')?.focus();return}if(a==='repair'){state.update.broken=false;state.notice='Sample binding corrected. Local names are unchanged.';render();return}state=transition(state,{type:a});render()}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-face],[data-focus],[data-inspect],[data-open],[data-trace],[data-candidate]');if(!el)return;if(el.dataset.action)action(el.dataset.action);if(el.dataset.face){state.face=el.dataset.face;render()}if(el.dataset.focus){state.focus=el.dataset.focus;render()}if(el.dataset.inspect)showDetails(el.dataset.inspect);if(el.dataset.open)openRecord(el.dataset.open);if(el.dataset.trace)openRecord(el.dataset.trace,true);if(el.dataset.candidate){let c=components[el.dataset.candidate];state.object={...c,kind:'interface',target:'interfaces',pk:9900+Number(el.dataset.number),name:'Candidate interface '+el.dataset.number,binding:'Explicitly selected candidate'};state.page='object';document.getElementById('overlay').innerHTML='';render()}});
document.addEventListener('change',e=>{if(e.target.id==='componentPicker')showDetails(e.target.value)});
document.getElementById('hover').addEventListener('mouseenter',()=>clearTimeout(hideTimer));document.getElementById('hover').addEventListener('mouseleave',()=>{hideTimer=setTimeout(hideHover,400)});
function switchVariant(d){let keys=Object.keys(variants),i=keys.indexOf(variant);variant=keys[(i+d+keys.length)%keys.length];let url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);document.getElementById('overlay').innerHTML='';render()}
document.getElementById('prevVariant').onclick=()=>switchVariant(-1);document.getElementById('nextVariant').onclick=()=>switchVariant(1);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideHover();action('close');return}if(e.key==='Tab'&&document.querySelector('.overlay')){let items=[...document.querySelectorAll('.overlay button,.overlay select,.overlay a')].filter(el=>!el.disabled);let first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}if(e.target.closest('input,textarea,select,[contenteditable="true"],.overlay,[data-key]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();switchVariant(e.key==='ArrowRight'?1:-1)}});
render();
</script>
</body>
</html>
