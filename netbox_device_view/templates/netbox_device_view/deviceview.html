{% extends 'dcim/device/base.html' %}
{% block head %}
{% include 'netbox_device_view/inc/device_view_head.html' %}
{% endblock %}
{% block content %}
<div class="card">
	<div class="card-body htmx-container">
		{% include 'netbox_device_view/inc/device_view_panels.html' %}
	</div>
</div>

<div class="card">
	<div class="card-header">
		<h4>Options</h4>
	</div>
	<div class="card-body">
		<form>
			<div class="form-check">
				<input onChange="this.form.submit()" type="checkbox" name="cable_colors" class="form-check-input" {% if cable_colors == "on" %}checked{% endif %} />
				<label for="cable_colors" class="form-check-label">Cable Colors</label>
			</div>
		</form>
	</div>
</div>
{% endblock %}
