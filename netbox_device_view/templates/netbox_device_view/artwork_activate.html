{% extends 'generic/_base.html' %}
{% load form_helpers %}
{% load i18n %}

{% block title %}{% trans "Activate" %} {{ object }}{% endblock %}

{% block content %}
  <div class="row">
    <div class="col col-md-10 col-lg-8">
      <p class="text-muted">{{ form.intro }}</p>
      <form method="get" action="{% url 'plugins:netbox_device_view:association_review' %}" class="card">
        <input type="hidden" name="revision" value="{{ object.pk }}">
        <input type="hidden" name="return_url" value="{{ object.get_absolute_url }}">
        <h2 class="card-header">{{ form.type_bound_field.label }}</h2>
        <div class="card-body">
          {% render_field form.type_bound_field %}
          <div class="text-end">
            <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
            <button type="submit" class="btn btn-primary">{% trans "Review" %}</button>
          </div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
